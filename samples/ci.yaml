# Build de Unity en GitHub Actions
name: Build
on:
  push:
    branches: [main]
env:
  UNITY_VERSION: 6000.0.23f1
  RETRIES: 3
  DEBUG: false

defaults: &unity
  runs-on: ubuntu-latest
  timeout-minutes: 60

jobs:
  build:
    <<: *unity
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Build WebGL
        run: |
          echo "Building ${{ env.UNITY_VERSION }}"
          ./ci/build.sh --target WebGL
      - name: Notify
        if: ${{ failure() }}
        run: echo 'Falló' # comentario al final
